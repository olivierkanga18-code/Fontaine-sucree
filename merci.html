<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci — Fontaine Sucrée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sage: #5e6f63;
    --sage-dark: #3f4b42;
    --tan: #c89b6d;
    --cream: #f4efe8;
    --ink: #17190f;
    --tan-30: color-mix(in srgb, var(--tan) 35%, var(--cream));
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--cream);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    padding:32px;
    position:relative;
    overflow:hidden;
  }
  body::before{
    content:"";
    position:absolute;
    inset:-20% -10% auto -10%;
    height:120%;
    background:
      radial-gradient(45% 55% at 25% 20%, color-mix(in srgb, var(--tan) 30%, transparent) 0%, transparent 70%),
      radial-gradient(50% 55% at 80% 15%, color-mix(in srgb, var(--sage) 20%, transparent) 0%, transparent 70%);
    pointer-events:none;
  }
  .card{
    position:relative;
    z-index:1;
    max-width:520px;
    text-align:center;
    background:#fff;
    border-radius:26px;
    padding:clamp(36px, 6vw, 56px);
    box-shadow:0 30px 70px -25px rgba(23,25,15,0.3);
  }
  .icon{
    width:64px; height:64px;
    margin:0 auto 1.6rem;
    border-radius:50%;
    background:var(--tan-30);
    display:flex; align-items:center; justify-content:center;
  }
  .icon svg{width:30px; height:30px; color:var(--sage-dark);}
  .brandline{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:1rem;
    color:var(--sage-dark);
    margin-bottom:1.4rem;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(1.6rem, 4vw, 2.1rem);
    margin:0 0 .8rem;
    line-height:1.2;
  }
  p{
    font-size:1.02rem;
    color:color-mix(in srgb, var(--ink) 78%, transparent);
    margin:0 0 2rem;
  }
  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:.5em;
    padding:.9em 1.7em;
    border-radius:999px;
    font-weight:600;
    text-decoration:none;
    font-size:.98rem;
  }
  .btn-whatsapp{
    background:var(--sage-dark);
    color:#fff;
    box-shadow:0 14px 30px -12px rgba(63,75,66,0.6);
  }
  .btn-outline{
    background:transparent;
    color:var(--sage-dark);
    border:1.5px solid var(--sage-dark);
  }
  footer{
    position:relative;
    z-index:1;
    margin-top:1.8rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="brandline">Fontaine Sucrée</div>
    <h1>Ta réservation est bien reçue 🌿</h1>
    <p>On te contacte très vite pour confirmer ta commande et organiser la livraison. En attendant, si tu veux aller plus vite, écris-nous directement sur WhatsApp.</p>
    <div class="actions">
      <a href="https://wa.me/2250170501516" target="_blank" rel="noopener" class="btn btn-whatsapp">📲 Nous écrire sur WhatsApp</a>
      <a href="index.html" class="btn btn-outline">Retour à l'accueil</a>
    </div>
  </div>
</body>
</html>
