<style>
  :root{
    --sage: #5e6f63;
    --sage-dark: #3f4b42;
    --tan: #c89b6d;
    --cream: #f4efe8;
    --ink: #17190f;
    --tan-30: color-mix(in srgb, var(--tan) 35%, var(--cream));
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    background:var(--cream);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    padding:64px 32px 32px;
    position:relative;
    overflow:hidden;
  }
  body::before{
    content:"";
    position:absolute;
    inset:-20% -10% auto -10%;
    height:120%;
    background:
      radial-gradient(45% 55% at 25% 20%, color-mix(in srgb, var(--tan) 30%, transparent) 0%, transparent 70%),
      radial-gradient(50% 55% at 80% 15%, color-mix(in srgb, var(--sage) 20%, transparent) 0%, transparent 70%);
    pointer-events:none;
  }
  .card{
    position:relative;
    z-index:1;
    max-width:520px;
    text-align:center;
    background:#fff;
    border-radius:26px;
    padding:clamp(36px, 6vw, 56px);
    box-shadow:0 30px 70px -25px rgba(23,25,15,0.3);
  }
  .icon{
    width:76px; height:76px;
    margin:0 auto 1.6rem;
    border-radius:50%;
    background:var(--sage-dark);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 6px var(--tan-30), 0 16px 30px -14px rgba(63,75,66,0.45);
  }
  .icon svg{width:30px; height:30px; color:#fff; stroke-width:2.2;}
  .brandline{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:1rem;
    color:var(--sage-dark);
    margin-bottom:1.4rem;
  }
  .greet{
    font-family:'Work Sans', sans-serif;
    font-size:1.05rem;
    font-weight:600;
    color:var(--sage);
    margin:0 0 1.3rem;
  }
  .highlight{
    background:var(--tan-30);
    color:var(--sage-dark);
    padding:0.03em 0.22em;
    border-radius:6px;
    box-decoration-break:clone;
    -webkit-box-decoration-break:clone;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    color:var(--ink);
    font-size:clamp(1.7rem, 4.2vw, 2.25rem);
    margin:0 0 .9rem;
    line-height:1.2;
  }
  p{
    font-size:1.02rem;
    color:color-mix(in srgb, var(--ink) 78%, transparent);
    margin:0 0 2rem;
  }
  .actions{
    display:flex;
    justify-content:center;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:.5em;
    padding:1em 2em;
    border-radius:999px;
    font-weight:600;
    text-decoration:none;
    font-size:1rem;
  }
  .btn-whatsapp{
    background:var(--sage-dark);
    color:#fff;
    border:2px solid var(--tan);
    box-shadow:0 14px 30px -12px rgba(63,75,66,0.6);
  }
  footer{
    position:relative;
    z-index:1;
    margin-top:1.8rem;
  }
  @media (max-width: 480px){
    body{ padding:40px 20px 24px; }
  }
</style>
</head>
<body>
  <div class="card">

  <script>
    var params = new URLSearchParams(window.location.search);
    var nom = params.get('nom') || '';
    var telephone = params.get('telephone') || '';
    var ville = params.get('ville') || '';
    var prenom = nom.split(' ')[0] || '';

    if (prenom) {
      document.getElementById('greetLine').textContent = 'Bravo ' + prenom + ', on a bien reçu tes infos';
    }

    // Si on a les infos de la commande, on construit un message WhatsApp pré-rempli
    // avec le récapitulatif complet — sinon on garde le message générique par défaut.
    if (nom && telephone && ville) {
      var message =
        "Bonjour, je viens de passer commande sur le site Fontaine Sucrée 🌿\n" +
        "Nom : " + nom + "\n" +
        "Téléphone : " + telephone + "\n" +
        "Lieu de livraison : " + ville + "\n" +
        "Produit : 1 pack (2 sachets) - 6 500 FCFA\n" +
        "Je souhaite valider ma commande et recevoir la posologie.";

      document.getElementById('waLink').href =
        "https://wa.me/2250170501516?text=" + encodeURIComponent(message);
    }
  </script>
